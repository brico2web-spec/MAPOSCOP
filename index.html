<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ZAMZAM Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">Z<span>AMZAM</span></div>
  <div>
    <button onclick="openAuth()">حسابي</button>
    <button onclick="openCart()">🛒 <b id="count">0</b></button>
  </div>
</header>

<main>
  <section class="hero">
    <small>COLLECTION 2026</small>
    <h1>ستايلك يبدأ<br><em>من هنا.</em></h1>
    <p>أحدث الملابس بلمسة عصرية وأنيقة.</p>
    <button class="dark" onclick="document.querySelector('#products').scrollIntoView({behavior:'smooth'})">تسوق الآن</button>
  </section>

  <section>
    <h2>الأقسام</h2>
    <div id="cats" class="cats"></div>
  </section>

  <section>
    <div class="row">
      <h2>المنتجات</h2>
      <input id="search" placeholder="بحث..." oninput="render()">
    </div>
    <div id="products" class="grid"></div>
  </section>
</main>

<div id="modal" class="modal hidden" onclick="if(event.target.id==='modal')closeModal()">
  <div class="sheet" id="sheet"></div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
